name: CI

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Clippy (default features)
      run: cargo clippy --all-targets -- -D warnings

    - name: Test (all features)
      run: cargo test --all-features

    - name: Test (default features)
      run: cargo test

  release-binaries:
    name: release ${{ matrix.target }}${{ matrix.features && format(' (+{0})', matrix.features) || '' }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ship both the default `simple` backend and the opt-in tantivy recall
        # variant for every target.
        features:
        - ''
        - recall-tantivy
        target:
        - x86_64-unknown-linux-gnu
        - aarch64-apple-darwin
        - x86_64-pc-windows-msvc
        include:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: muninn-${{ matrix.target }}${{ matrix.features && format('-{0}', matrix.features) || '' }}
        path: |
          target/${{ matrix.target }}/release/muninn
          target/${{ matrix.target }}/release/muninn.exe
        if-no-files-found: ignore

  publish-image:
    name: publish container image
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # QEMU lets the amd64 runner boot the arm64 image for its smoke test.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Source the OCI labels that metadata-action does not generate from the
    # crate manifest, so they stay in sync with Cargo.toml.
    - name: Read authors and documentation from Cargo.toml
      run: |
        meta=$(cargo metadata --no-deps --format-version 1)
        echo "IMAGE_AUTHORS=$(echo "$meta" | jq -r '.packages[0].authors | join(", ")')" >> "$GITHUB_ENV"
        echo "IMAGE_DOCUMENTATION=$(echo "$meta" | jq -r '.packages[0].documentation')" >> "$GITHUB_ENV"

    - name: Compute tags and labels
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/progamesigner/muninn
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest
          type=sha,prefix=sha-
        labels: |
          org.opencontainers.image.authors=${{ env.IMAGE_AUTHORS }}
          org.opencontainers.image.documentation=${{ env.IMAGE_DOCUMENTATION }}
          org.opencontainers.image.vendor=progamesigner

    # Build every published arch and smoke-test each before any push is trusted.
    # --load only accepts one platform per call, so build them separately.
    - name: Build amd64 image for smoke test
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        build-args: |
          CARGO_FEATURES=recall-tantivy
          MUNINN_RECALL_BACKEND=tantivy
        platforms: linux/amd64
        load: true
        tags: muninn:smoke-amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build arm64 image for smoke test
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        build-args: |
          CARGO_FEATURES=recall-tantivy
          MUNINN_RECALL_BACKEND=tantivy
        platforms: linux/arm64
        load: true
        tags: muninn:smoke-arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test the health endpoint on every arch
      run: |
        set -e
        for arch in amd64 arm64; do
          echo "::group::smoke linux/$arch"
          docker run -d --name "smoke-$arch" -p 8000:8000 "muninn:smoke-$arch"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then ok=1; break; fi
            sleep 1
          done
          docker logs "smoke-$arch"
          docker rm -f "smoke-$arch"
          echo "::endgroup::"
          if [ "$ok" != "1" ]; then echo "smoke test failed on linux/$arch"; exit 1; fi
        done

    - name: Build and push multi-arch image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        build-args: |
          CARGO_FEATURES=recall-tantivy
          MUNINN_RECALL_BACKEND=tantivy
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
