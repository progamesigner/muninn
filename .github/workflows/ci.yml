name: CI

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Clippy (default features)
      run: cargo clippy --all-targets -- -D warnings

    - name: Test (all features)
      run: cargo test --all-features

    - name: Test (default features)
      run: cargo test

  release-binaries:
    name: release ${{ matrix.target }}${{ matrix.features && format(' (+{0})', matrix.features) || '' }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ship both the default `simple` backend and the opt-in tantivy recall
        # variant for every target.
        features:
        - ''
        - recall-tantivy
        target:
        - x86_64-unknown-linux-gnu
        - aarch64-apple-darwin
        - x86_64-pc-windows-msvc
        include:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-26.04
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: muninn-${{ matrix.target }}${{ matrix.features && format('-{0}', matrix.features) || '' }}
        path: |
          target/${{ matrix.target }}/release/muninn
          target/${{ matrix.target }}/release/muninn.exe
        if-no-files-found: ignore

  # Each arch builds on its own native runner (no QEMU, no cross linker),
  # smoke-tests the image it just built, then pushes it by digest only. The
  # merge job below stitches the digests into one multi-arch tag set, so no tag
  # moves unless every arch passed its smoke test.
  build-image:
    name: build image linux/${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-26.04
        - arch: arm64
          runner: ubuntu-26.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Source the OCI labels that metadata-action does not generate from the
    # crate manifest, so they stay in sync with Cargo.toml.
    - name: Read authors and documentation from Cargo.toml
      run: |
        meta=$(cargo metadata --no-deps --format-version 1)
        echo "IMAGE_AUTHORS=$(echo "$meta" | jq -r '.packages[0].authors | join(", ")')" >> "$GITHUB_ENV"
        echo "IMAGE_DOCUMENTATION=$(echo "$meta" | jq -r '.packages[0].documentation')" >> "$GITHUB_ENV"

    - name: Compute labels
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/progamesigner/muninn
        labels: |
          org.opencontainers.image.authors=${{ env.IMAGE_AUTHORS }}
          org.opencontainers.image.documentation=${{ env.IMAGE_DOCUMENTATION }}
          org.opencontainers.image.vendor=progamesigner

    - name: Build image for smoke test
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        build-args: |
          CARGO_FEATURES=recall-tantivy
          MUNINN_RECALL_BACKEND=tantivy
        platforms: linux/${{ matrix.arch }}
        load: true
        tags: muninn:smoke
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=image-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

    - name: Smoke test the health endpoint
      run: |
        set -e
        docker run -d --name smoke -p 8000:8000 muninn:smoke
        ok=0
        for _ in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8000/healthz; then ok=1; break; fi
          sleep 1
        done
        docker logs smoke
        docker rm -f smoke
        if [ "$ok" != "1" ]; then echo "smoke test failed on linux/${{ matrix.arch }}"; exit 1; fi

    # Same inputs as the smoke build, so this is served from the build cache.
    - name: Push image by digest
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        build-args: |
          CARGO_FEATURES=recall-tantivy
          MUNINN_RECALL_BACKEND=tantivy
        platforms: linux/${{ matrix.arch }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=ghcr.io/progamesigner/muninn,push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=image-${{ matrix.arch }}

    - name: Export digest
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        digest="${{ steps.push.outputs.digest }}"
        touch "$RUNNER_TEMP/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  publish-image:
    name: publish multi-arch image
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute tags
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/progamesigner/muninn
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest
          type=sha,prefix=sha-

    - name: Create and push the multi-arch manifest
      working-directory: ${{ runner.temp }}/digests
      run: |
        # Word splitting is intended: each jq/printf result is a list of args.
        # shellcheck disable=SC2046
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf 'ghcr.io/progamesigner/muninn@sha256:%s ' *)

    - name: Inspect the published image
      run: docker buildx imagetools inspect "ghcr.io/progamesigner/muninn:${{ steps.meta.outputs.version }}"
